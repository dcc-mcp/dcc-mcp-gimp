tools:
  - name: get_status
    description: Verify the authenticated GIMP bridge, main-thread executor, allowed roots, version, and typed command catalog.
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: true}
    source_file: scripts/get_status.py

  - name: list_images
    description: List images in this GIMP instance with bounded metadata and instance-scoped IDs.
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: true}
    source_file: scripts/list_images.py
    next-tools: {on-success: [inspect_image]}

  - name: get_active_image
    description: Return bounded metadata for the active GIMP image, or null when no image is open.
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: true}
    source_file: scripts/get_active_image.py

  - name: inspect_image
    description: >-
      Inspect one GIMP image and its bounded recursive layer tree. Optionally
      report image parasite metadata and the effective ICC profile byte identity.
    input_schema:
      type: object
      required: [image_id]
      properties:
        image_id: {type: integer, minimum: 1}
        include_metadata: {type: boolean, default: false}
        include_icc_identity:
          type: boolean
          default: false
          description: >-
            Also read the native effective ICC profile and report its byte count
            and SHA-256, plus whether the image explicitly stores a profile.
            Read-only; the profile payload itself is never returned.
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: true}
    source_file: scripts/inspect_image.py

  - name: list_layers
    description: Return the bounded flattened layer hierarchy for one open GIMP image.
    input_schema:
      type: object
      required: [image_id]
      properties: {image_id: {type: integer, minimum: 1}}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: true}
    source_file: scripts/list_layers.py

  - name: create_image
    description: Create and display a bounded RGB GIMP image with one typed RGBA base layer.
    input_schema:
      type: object
      required: [width, height, name]
      properties:
        width: {type: integer, minimum: 1, maximum: 16384}
        height: {type: integer, minimum: 1, maximum: 16384}
        name: {type: string, minLength: 1, maxLength: 256}
        background_color: {type: array, minItems: 3, maxItems: 4, items: {type: integer, minimum: 0, maximum: 255}}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: false, deferred_hint: true}
    source_file: scripts/create_image.py
    next-tools: {on-success: [create_layer, save_image]}

  - name: open_image
    description: Open one supported image or XCF under an allowed root and display it in GIMP.
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string, minLength: 1, maxLength: 2048}
        timeout_secs: {type: number, minimum: 1, maximum: 1800, default: 120}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 1800
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: false, deferred_hint: true}
    source_file: scripts/open_image.py
    next-tools: {on-success: [inspect_image]}

  - name: save_image
    description: Save a layered GIMP image as XCF under an allowed root with explicit overwrite opt-in.
    input_schema:
      type: object
      required: [image_id, path]
      properties:
        image_id: {type: integer, minimum: 1}
        path: {type: string, minLength: 1, maxLength: 2048}
        overwrite: {type: boolean, default: false}
        timeout_secs: {type: number, minimum: 1, maximum: 1800, default: 300}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 1800
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: true}
    source_file: scripts/save_image.py

  - name: export_image
    description: Export one image to PNG, JPEG, WebP, or TIFF under an allowed root and return bytes plus SHA-256.
    input_schema:
      type: object
      required: [image_id, path]
      properties:
        image_id: {type: integer, minimum: 1}
        path: {type: string, minLength: 1, maxLength: 2048}
        overwrite: {type: boolean, default: false}
        timeout_secs: {type: number, minimum: 1, maximum: 1800, default: 300}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 1800
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: true}
    source_file: scripts/export_image.py

  - name: create_layer
    description: Create a full-image RGBA layer, optionally filled with a typed RGB or RGBA color, and select it.
    input_schema:
      type: object
      required: [image_id, name]
      properties:
        image_id: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 256}
        color: {type: array, minItems: 3, maxItems: 4, items: {type: integer, minimum: 0, maximum: 255}}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: false, deferred_hint: true}
    source_file: scripts/create_layer.py
    next-tools: {on-success: [fill_layer, set_layer_properties]}

  - name: fill_layer
    description: Fill an existing paintable layer with a typed RGB or RGBA color.
    input_schema:
      type: object
      required: [image_id, layer_id, color]
      properties:
        image_id: {type: integer, minimum: 1}
        layer_id: {type: integer, minimum: 1}
        color: {type: array, minItems: 3, maxItems: 4, items: {type: integer, minimum: 0, maximum: 255}}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 300
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: true, open_world_hint: false, deferred_hint: true}
    source_file: scripts/fill_layer.py

  - name: set_layer_properties
    description: Change typed layer name, visibility, content lock, or opacity.
    input_schema:
      type: object
      required: [image_id, layer_id]
      properties:
        image_id: {type: integer, minimum: 1}
        layer_id: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 256}
        visible: {type: boolean}
        locked: {type: boolean}
        opacity: {type: number, minimum: 0, maximum: 100}
      minProperties: 3
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: true, open_world_hint: false, deferred_hint: true}
    source_file: scripts/set_layer_properties.py

  - name: set_active_layer
    description: Select one existing layer in an open GIMP image.
    input_schema:
      type: object
      required: [image_id, layer_id]
      properties: {image_id: {type: integer, minimum: 1}, layer_id: {type: integer, minimum: 1}}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: true}
    source_file: scripts/set_active_layer.py

  - name: delete_layer
    description: Delete one referenced layer while preserving at least one image layer.
    input_schema:
      type: object
      required: [image_id, layer_id]
      properties: {image_id: {type: integer, minimum: 1}, layer_id: {type: integer, minimum: 1}}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: true}
    source_file: scripts/delete_layer.py

  - name: flatten_image
    description: Irreversibly flatten visible layers after explicit confirmation.
    input_schema:
      type: object
      required: [image_id, confirm]
      properties: {image_id: {type: integer, minimum: 1}, confirm: {type: boolean, const: true}}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 300
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: true}
    source_file: scripts/flatten_image.py

  - name: close_image
    description: Close only a bridge-opened display; dirty images require explicit discard_changes=true.
    input_schema:
      type: object
      required: [image_id]
      properties:
        image_id: {type: integer, minimum: 1}
        discard_changes: {type: boolean, default: false}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: true}
    source_file: scripts/close_image.py

  - name: create_group
    description: Create an editable layer group with bounded parent and insertion position.
    input_schema:
      type: object
      required:
      - image_id
      - name
      properties:
        image_id: &id001
          type: integer
          minimum: 1
        name: &id002
          type: string
          minLength: 1
          maxLength: 256
        parent_id: *id001
        position: &id003
          type: integer
          minimum: 0
          maximum: 20000
      additionalProperties: false
    output_schema:
      type: object
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    source_file: scripts/create_group.py
  - name: import_layer
    description: Import an allowed local image as a named editable GIMP layer.
    input_schema:
      type: object
      required:
      - image_id
      - path
      properties:
        image_id: *id001
        path:
          type: string
          minLength: 1
          maxLength: 2048
        name: *id002
        parent_id: *id001
        position: *id003
      additionalProperties: false
    output_schema:
      type: object
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    source_file: scripts/import_layer.py
  - name: place_layer
    description: Place a layer into a group and set its native pixel offsets.
    input_schema:
      type: object
      required:
      - image_id
      - layer_id
      properties:
        image_id: *id001
        layer_id: *id001
        parent_id: *id001
        position: *id003
        x: &id004
          type: integer
          minimum: -32768
          maximum: 32768
        y: *id004
      additionalProperties: false
    output_schema:
      type: object
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    source_file: scripts/place_layer.py
  - name: set_layer_mode
    description: Set a fixed native blend mode; pass-through requires a group.
    input_schema:
      type: object
      required:
      - image_id
      - layer_id
      - mode
      properties:
        image_id: *id001
        layer_id: *id001
        mode:
          type: string
          enum:
          - normal
          - multiply
          - screen
          - overlay
          - soft-light
          - pass-through
      additionalProperties: false
    output_schema:
      type: object
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    source_file: scripts/set_layer_mode.py
  - name: paint_shape
    description: Paint a bounded native polygon, ellipse, or rectangle in encoded sRGB;
      preserve selection.
    input_schema:
      type: object
      required:
      - image_id
      - layer_id
      - shape
      - color
      properties:
        image_id: *id001
        layer_id: *id001
        shape:
          type: string
          enum:
          - polygon
          - ellipse
          - rectangle
        color: &id005
          type: array
          minItems: 3
          maxItems: 4
          items:
            type: integer
            minimum: 0
            maximum: 255
        points:
          type: array
          minItems: 3
          maxItems: 256
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
              minimum: -32768
              maximum: 32768
        bounds:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
            minimum: -32768
            maximum: 32768
        feather:
          type: number
          minimum: 0
          maximum: 256
      additionalProperties: false
      allOf:
      - if:
          properties:
            shape:
              const: polygon
        then:
          required:
          - points
        else:
          required:
          - bounds
    output_schema:
      type: object
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    source_file: scripts/paint_shape.py
  - name: create_text
    description: Create editable native text with an installed font and encoded-sRGB
      color.
    input_schema:
      type: object
      required:
      - image_id
      - text
      - name
      properties:
        image_id: *id001
        text:
          type: string
          minLength: 1
          maxLength: 4096
        name: *id002
        font: *id002
        size:
          type: number
          minimum: 1
          maximum: 2048
        x: *id004
        y: *id004
        parent_id: *id001
        color: *id005
      additionalProperties: false
    output_schema:
      type: object
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
      deferred_hint: true
    source_file: scripts/create_text.py

  - name: list_fonts
    description: List native GIMP font resource names with a bounded literal substring filter.
    input_schema:
      type: object
      properties:
        query: {type: string, maxLength: 128}
        limit: {type: integer, minimum: 1, maximum: 256, default: 64}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: true}
    source_file: scripts/list_fonts.py

  - name: export_layer
    description: Export one unmasked non-group native drawable to a transparent full-canvas PNG through a temporary native copy; preserve source image and offsets. Masked layers are rejected before allocation.
    input_schema:
      type: object
      required: [image_id, layer_id, path]
      properties:
        image_id: {type: integer, minimum: 1}
        layer_id: {type: integer, minimum: 1}
        path: {type: string, minLength: 1, maxLength: 2048}
        overwrite: {type: boolean, default: false}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 120
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: false, deferred_hint: true}
    source_file: scripts/export_layer.py

  - name: export_preview
    description: Export an aspect-preserving PNG preview of a native duplicate, without upscaling or modifying the RGB/RGBA 8-bit non-linear source. Maximum output box is 2048 by 2048.
    input_schema:
      type: object
      required: [image_id, path, max_width, max_height]
      properties:
        image_id: {type: integer, minimum: 1, maximum: 2147483647}
        path: {type: string, minLength: 1, maxLength: 2048}
        max_width: {type: integer, minimum: 1, maximum: 2048}
        max_height: {type: integer, minimum: 1, maximum: 2048}
        overwrite: {type: boolean, default: false}
      additionalProperties: false
    output_schema: {type: object}
    execution: async
    job_strategy: monolithic
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 300
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: true}
    source_file: scripts/export_preview.py
